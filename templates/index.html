<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teoría de Decisiones — Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.css">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-3">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Teoría de Decisiones</a>
      </div>
    </nav>

    <div class="container">
      <div class="row">
        <div class="col-lg-3">
          <div class="list-group" id="sidebarMenu" role="tablist">
            <a class="list-group-item list-group-item-action active" id="nav-vars" data-bs-toggle="list" href="#tab-vars-pane" role="tab" aria-controls="tab-vars-pane">1) Variables</a>
            <a class="list-group-item list-group-item-action" id="nav-tables" data-bs-toggle="list" href="#tab-tables-pane" role="tab" aria-controls="tab-tables-pane">2) Tablas</a>
            <a class="list-group-item list-group-item-action" id="nav-tree" data-bs-toggle="list" href="#tab-tree-pane" role="tab" aria-controls="tab-tree-pane">3) Árbol de Bayes</a>
            <a class="list-group-item list-group-item-action" id="nav-charts" data-bs-toggle="list" href="#tab-charts-pane" role="tab" aria-controls="tab-charts-pane">4) Gráficas</a>
            <a class="list-group-item list-group-item-action" id="nav-summary" data-bs-toggle="list" href="#tab-summary-pane" role="tab" aria-controls="tab-summary-pane">5) Resumen</a>
          </div>
        </div>

        <div class="col-lg-9">
          <div class="tab-content">
            <div class="tab-pane fade show active" id="tab-vars-pane" role="tabpanel">
              <div class="card mb-3">
                <div class="card-body">
                  <h5 class="card-title">Variables</h5>
                  <form id="varsForm">
                    <div class="mb-2">
                      <label class="form-label">Nombre Estado 1</label>
                      <input id="state1_name" class="form-control" value="S1: Demanda sostenible" />
                    </div>
                    <div class="mb-2">
                      <label class="form-label">Nombre Estado 2</label>
                      <input id="state2_name" class="form-control" value="S2: Baja demanda" />
                    </div>
                    <div class="row g-2">
                      <div class="col-6">
                        <label class="form-label">P(S1)</label>
                        <input step="0.01" min="0" max="1" class="form-control" id="p_s1" value="0.7" />
                      </div>
                      <div class="col-6">
                        <label class="form-label">P(F|S1)</label>
                        <input step="0.01" min="0" max="1" class="form-control" id="pf_s1" value="0.9" />
                      </div>
                    </div>
                    <div class="mb-2 mt-2">
                      <label class="form-label">P(F|S2)</label>
                      <input step="0.01" min="0" max="1" class="form-control" id="pf_s2" value="0.25" />
                    </div>

                    <hr />
                    <label class="form-label">Alternativas (una por línea)</label>
                    <textarea id="alt_names" class="form-control" rows="3">Empresa externa
Vehículos
Procesos</textarea>

                    <div class="mt-3">
                      <label class="form-label">Tabla de pagos (edítala directamente)</label>
                      <div id="payTableContainer" class="table-responsive"></div>
                    </div>

                    <div class="mt-3 d-flex gap-2">
                      <button class="btn btn-secondary" type="button" id="addAltBtn">Agregar alternativa</button>
                      <button class="btn btn-primary ms-auto" type="button" id="computeBtn">Calcular</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>

            <div class="tab-pane fade" id="tab-tables-pane" role="tabpanel">
              <div id="tablesArea" class="mb-3"></div>
            </div>

            <div class="tab-pane fade" id="tab-tree-pane" role="tabpanel">
              <div id="treeArea" class="p-3 bg-white rounded shadow-sm" style="min-height:220px;"></div>
            </div>

            <div class="tab-pane fade" id="tab-charts-pane" role="tabpanel">
              <div id="chartArea" class="p-3 bg-white rounded shadow-sm"></div>
            </div>
            <div class="tab-pane fade" id="tab-summary-pane" role="tabpanel">
              <div id="summaryArea" class="p-3 bg-white rounded shadow-sm"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
    <script src="/static/js/tree-d3.js"></script>
    <script src="/static/js/main.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>
  </body>
  </html>
